#warn{position:absolute;top:2%;left:12%;width:30%;background:#c0201a;border:3px solid #fff;padding:.8em;font-size:.8em;line-height:1.6}

.tk{background:#2d3a5a;border:3px solid #555;padding:.8em;margin:.5em 0;line-height:1.5}
.tk.hv{border-color:#5ee08a;background:#3b5a3f}
.cur{position:absolute;width:2.2em;height:2.2em;margin:-1.1em 0 0 -1.1em;border:3px solid #fff;border-radius:50%;background:#ff4d4d88;display:none;pointer-events:none}

.bar{height:.9em;background:#333;margin-top:.4em;border:2px solid #fff}.bar i{display:block;height:100%;background:#5ee08a}

.tl{background:#2d3a5a;border:3px solid #555;padding:.9em .4em;text-align:center;line-height:1.4}
#brk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;background:#22252e;border:4px solid #e0b020;padding:1em;font-size:.8em}

.cur{z-index:50}

function viewLocked(){if(state!=='scene'||!picked||!inspected)return false;const a=ACTS[picked.type][stepI];return !!a&&/:(flip|find|rub)/.test(a)}
function actTick(dt){const A=curAct(),box=$('act'),mk=$('mark'),m1=$('mk1'),m2=$('mk2'),cl2=$('call'),cs=b=>{if(cl2.hidden===b)cl2.hidden=!b};mk.hidden=m1.hidden=m2.hidden=true;

 let msg=!facing?t('turnBack'):!devOK?t('pickDev'):locked?`${t('readNext')} ${Math.ceil(stepLock)}`:wrong?`${t('wrong')}: ${tn(A.tool)}`:t('act')[k];
 if(k==='flip'&&facing&&!wrong&&!locked)msg+=' '+(pat[flipSt]==='U'?t('up'):t('dn'));
 if(A.shut&&facing&&!devOK)[[m1,1.1],[m2,-1.1]].forEach(([e,x])=>{v3.set(x,1.5,3.3).project(cam);e.style.left=(v3.x*.5+.5)*W+'px';e.style.top=(-v3.y*.5+.5)*H+'px';e.hidden=false});
 if(k==='insp'){v3.set(...FXPOS[picked.type]).project(cam);const px=(v3.x*.5+.5)*W,py=(-v3.y*.5+.5)*H;
  mk.style.left=px+'px';mk.style.top=py+'px';mk.hidden=v3.z>1;prog=Math.max(0,prog+(S.some(h=>h.vis&&Math.hypot(h.cx-px,h.cy-py)<3.5*em)?dt:-dt))}
 else if(facing&&!wrong&&devOK&&!locked){let d=0;
  if(k==='cw'||k==='ccw'){for(const h of S)if(h.st==='fist'){const v=(k==='cw'?1:-1)*h.dwr;if(v>1)d+=v*1.3}prog+=d}
  else if(k==='pull'){for(const h of S)if(h.st==='pinch')d+=h.dmv;prog+=d}
  else if(k==='rub'){for(const h of S)if(h.st==='pinch'&&h.dmv>.004)d+=h.dmv;prog+=d}
  else if(k==='down'){for(const h of S)if(h.st==='pinch')d+=Math.max(0,h.dmy);prog+=d}
  else if(k==='flip'){for(const h of S)if(h.st==='pinch')d+=pat[flipSt]==='U'?Math.max(0,-h.dmy):Math.max(0,h.dmy);flipP+=d;
   if(flipP>=.12){flipSt++;flipP=0;const up=pat[flipSt-1]==='U';if(lightTask)setLight(up);else if(picked.type===5)setSw(trip,up)}
   prog=flipSt*.12+flipP}
  else if(k==='grab'){if(S.some(h=>h.st==='pinch'))prog+=dt}
  else if(k==='find'||k==='brk'){}
  else prog+=dt}
 if(needW)wheel.rotation.z=prog*Math.PI/180;
 if(k==='call'){if(itemBig)closePop();cs(true);cl2.textContent=prog<1.6?t('calling'):t('calledMsg')}else cs(false);
 box.hidden=false;box.innerHTML=`<b>${k==='insp'?t('inspHead'):TASKS[picked.type][lang].s[stepI]}</b>${A.tool!=='none'?' '+EM[A.tool]+' '+tn(A.tool):''}<br>${msg}<div class="bar"><i style="width:${Math.min(100,prog/need*100)}%"></i></div>`;
 if(k==='insp'&&prog>=need){inspected=true;prog=0;stepLock=4;openPop();return}
 if(prog>=need)completeStep()}
function testSwitch(s){const h=S[s],em=parseFloat(stage.style.fontSize)||16,pts=[[h.cx,h.cy]];if(h.hist.length>=8)pts.push(h.hist[0]);let best=-1,bd=1e9;
 for(const p of pts)sw.forEach((m,i)=>{m.getWorldPosition(v3).project(popCam);const d=Math.hypot(PR.l+(v3.x*.5+.5)*PR.w-p[0],PR.t+(-v3.y*.5+.5)*PR.h-p[1]);if(d<bd){bd=d;best=i}});

function renderBrk(){$('brk').innerHTML=`<h3>${t('brkTitle')}</h3><div class="bh">${t('brkHelp')} <b>${roomNo(picked)}</b><br>${t('brkHow')}</div><div class="tg4">`+brkItems.map((b,i)=>`<div class="br${b.on?'':' off'}" data-id="${i}"><div class="sl"><div class="hd" style="top:${b.on?0:70}%"></div></div>Rm ${b.room}<br>${b.on?'ON':'OFF'}</div>`).join('')+`</div><div class="br cl" data-id="close">${t('close')}</div>`}

const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function classify(l){
 const sc=d2(l[0],l[9])||1e-3,ext=[[8,6],[12,10],[16,14],[20,18]].map(([a,b])=>d2(l[0],l[a])>d2(l[0],l[b])*1.15);
 const th=d2(l[4],l[17])>d2(l[3],l[17])*1.1,n=ext.filter(Boolean).length;
 if(d2(l[4],l[8])/sc<.3)return'pinch';
 if(th&&ext[3]&&!ext[0]&&!ext[1]&&!ext[2])return'callme';
 if(th&&n===0&&l[4].y<l[5].y-.03)return'thumbsup';
 if(ext[0]&&!ext[1]&&!ext[2]&&!ext[3])return'point';
 if(n===4)return'open';
 if(n===0&&!th)return'fist';
 return'other'}
const S=[0,1].map(()=>({hist:[],dwr:0,dmv:0,dmy:0,g:'none',cnt:0,st:'none',vis:false,cx:0,cy:0,pa:null,wr:0,wl:null}));
function onEdge(s,g){const now=performance.now();
 if(g==='callme'&&state==='scene'&&inspected&&now>cool){cool=now+800;itemBig?closePop():openPop()}
 if(g==='callme'&&now>cool&&['room','arrived','done'].includes(state)&&(state!=='done'||looked)){
  if(!phoneOpen){cool=now+800;callRel=0;openPhone()} else if(callRel&&now-callRel>500){cool=now+800;closePhone()}}
 if(g==='pinch'&&phoneOpen){const k=tickets.find(x=>String(x.id)===hover(s,1));if(k)travel(k)}
 if(g==='pinch'&&toolOpen){const id=hover(s,1);if(id)pickTool(id)}
 if(g==='pinch'&&brkOpen){const id=hover(s,1);if(id==='close')closeBrk();else if(id!==null){brkSel[s]=+id;brkP[s]=0}}
 if(g==='pinch'&&state==='arrived'&&!phoneOpen&&!brkOpen){const A=curAct();if(A&&A.shut)chooseDev(s)}
 if(g==='pinch'&&state==='scene'&&!phoneOpen&&!toolOpen&&itemBig){const A=curAct();if(A&&A.act==='find'&&stepLock<=0)testSwitch(s)}
 if(g==='pinch'&&(!$('pop').hidden||!$('dock').hidden)){const id=hover(s,1);if(id==='icl')closePop();else if(id==='iop'&&picked)openPop()}
 if(g==='thumbsup'&&state==='arrived'&&!phoneOpen)snap()}
function hover(s,old){const h=S[s];if(!h.vis)return null;const r=stage.getBoundingClientRect(),pts=[[h.cx,h.cy]];if(old&&h.hist.length>=8)pts.push(h.hist[0]); // old = position just before the pinch moved the fingertip
 for(const p of pts)for(const e of document.querySelectorAll('#phone:not([hidden]) .tk,#tbox:not([hidden]) .tl,#brk:not([hidden]) .br,#pop:not([hidden]) .ib,#dock:not([hidden]) .ib')){const b=e.getBoundingClientRect(),x=p[0]+r.left,y=p[1]+r.top;if(x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom)return e.dataset.id}return null}
function handle(s,l){const h=S[s],g=classify(l);h.dwr=0;h.dmv=0;h.dmy=0;
 if(g===h.g)h.cnt++;else{h.g=g;h.cnt=1;h.pa=null}
 if(h.cnt>=3&&h.st!==g){h.st=g;h.pa=null;onEdge(s,g)}
 const W=stage.clientWidth,H=stage.clientHeight,tx=(1-(l[4].x+l[8].x)/2)*W,ty=((l[4].y+l[8].y)/2)*H;
 h.cx=h.vis?h.cx+(tx-h.cx)*.5:tx;h.cy=h.vis?h.cy+(ty-h.cy)*.5:ty;h.vis=true;
 const a=Math.atan2(l[17].y-l[5].y,-(l[17].x-l[5].x));
 if(h.pa!==null&&h.st===g){let dA=a-h.pa;if(dA>Math.PI)dA-=2*Math.PI;if(dA<-Math.PI)dA+=2*Math.PI;
  if(g==='fist'){h.wr+=dA*180/Math.PI;h.dwr=dA*180/Math.PI}}

 if(h.st==='pinch'){const mx=(l[4].x+l[8].x)/2,my=(l[4].y+l[8].y)/2;if(h.pp){h.dmv=Math.hypot(mx-h.pp[0],my-h.pp[1]);h.dmy=my-h.pp[1]}h.pp=[mx,my]}else h.pp=null;

  $('mMsg').textContent=(step==='camera'?'CAMERA ERROR: '+(H[e.name]||''):'HAND TRACKING FAILED: ')+' ['+(e.name||'')+' '+(e.message||e)+']';$('startBtn').disabled=false}};
