#note ol{margin:0;padding-left:1.4em}
#warn{position:absolute;top:2%;left:12%;width:30%;background:#c0201a;border:3px solid #fff;padding:.8em;font-size:.8em;line-height:1.6}

.tk{background:#2d3a5a;border:3px solid #555;padding:.8em;margin:.5em 0;line-height:1.5}
.tk.hv{border-color:#5ee08a;background:#3b5a3f}
.cur{position:absolute;width:2.2em;height:2.2em;margin:-1.1em 0 0 -1.1em;border:3px solid #fff;border-radius:50%;background:#ff4d4d88;display:none;pointer-events:none}
.cur.p{background:#5ee08acc;transform:scale(.6)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s;display:flex;align-items:center;justify-content:center;text-align:center;padding:12%;font-size:1em;line-height:2}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
.panel{position:absolute;inset:0;background:#0d0d18ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;text-align:center;line-height:1.8}
.panel[hidden],[hidden]{display:none!important}
.panel h1{font-size:2.6em;margin:0;color:#ffd23f}
#dbgPanel{position:absolute;z-index:9;bottom:1%;left:1%;width:22%;background:#000b;font-size:.5em;line-height:1.5;display:none}
.vw{position:relative;transform:scaleX(-1)}.vw video,.vw canvas{width:100%;display:block}.vw canvas{position:absolute;inset:0}
#dtxt{margin:.4em;white-space:pre-wrap}
.tk.hv,.tl.hv{border-color:#5ee08a;background:#3b5a3f}
#score{position:absolute;top:9.5%;left:50%;transform:translateX(-50%);font-size:.7em;background:#000a;padding:.4em .8em}
#say{position:absolute;top:16%;left:50%;transform:translateX(-50%);max-width:50%;background:#fff;color:#111;border:3px solid #000;padding:.7em 1em;font-size:.8em;line-height:1.6;text-align:center}
#act{position:absolute;bottom:13%;left:27%;width:46%;background:#000c;border:2px solid #ffd23f;padding:.6em;font-size:.7em;line-height:1.7;text-align:center}

 await sleep(1300);tp.innerHTML=`${t('tips')}<br><br>${TIPS[lang][rnd(TIPS[lang].length)]}`;await sleep(3500);
 sign(roomNo(k));const sh=TASKS[k.type].shut;pw.visible=sh==='power';wt.visible=sh==='water';lever.position.y=1.2;lever.material=M(0x30c050);wheel.rotation.z=0;
 setView('hall');tp.textContent='';f.style.opacity=0;await sleep(1200);
 stepI=0;prog=0;inHand=null;state='arrived';renderNote();renderHint()}
async function snap(){const T=TASKS[picked.type];if(stepI<(T.shut!=='none'?1:0)){say(t('shutFirst'));return}
 state='scene';prog=0;flipSt=0;flipP=0;const fl=$('flash');fl.style.opacity=1;await sleep(120);setView('scene');
 const ty=picked.type,li=ty===2||ty===3,tb=ty===3;lightTask=li;lightOn=false;setLight(false);ws.visible=li;bp.visible=ty===5;fx.visible=ty!==5;
 if(ty===5){sw.forEach((m,i)=>setSw(i,true));trip=rnd(6);setSw(trip,false);sw[trip].material=M(0xd08030);say(lang==='en'?'Test each breaker. The tripped one sits lower.':'Uji setiap pemutus. Yang tersentak lebih rendah.',4000)}
 fx.scale.set(tb?1.8:li?.45:1,tb?.22:li?.6:1,li?.8:1);fx.position.set(li?0:1,li?2.6:1.5,-2.8);led.position.set(li?0:1,li?2.25:2,-2.62);
 fxMat.color.set(T.shut==='water'?0x6b8fb0:li?0xffe9a0:T.shut==='power'?0xe0b020:0x9a9a9a);
 if(li)say(lang==='en'?'Look up: the light on the wall is flickering!':'Pandang atas: lampu di dinding berkelip!',4000);
 led.material.color.set(0xff3030);drip.visible=T.shut!=='power';
 fl.style.opacity=0;renderNote();renderHint()}
function startDay(){fixes=0;score=0;stepI=0;prog=0;inHand=null;closeTools();tLeft=300;tickets=[];picked=null;spawn();spawn();nextSpawn=10+Math.random()*20;setView('room');state='room';$('hud').hidden=false;
 for(const e of['menu','pause','end'])$(e).hidden=true;refresh()}
function endDay(){state='end';closePhone();$('end').hidden=false;$('pause').hidden=true;refresh()}
function pause(){if(!running()||state==='travel')return;prev=state;state='paused';$('pause').hidden=false}
function resume(){state=prev;$('pause').hidden=true}
$('pauseBtn').onclick=pause;$('resBtn').onclick=resume;$('quitBtn').onclick=endDay;$('againBtn').onclick=startDay;
addEventListener('keydown',e=>{if(e.key==='Escape')state==='paused'?resume():pause();
 if(e.key==='d'||e.key==='D'){const d=$('dbgPanel');d.style.display=d.style.display==='block'?'none':'block'}
 if(e.key==='r'||e.key==='R'){if(state==='scene'||state==='arrived'){state='room';picked=null;setView('room');renderNote();renderHint()}}});

/* ---------- TASK ENGINE ---------- */
let stepI=0,prog=0,score=0,looked=false,toolOpen=false,inHand=null,callRel=0,bookPrev=false,cool2=0,sayT=0,flipSt=0,flipP=0;
const ad=(a,b)=>((a-b+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
const TN={screwdriver:['Screwdriver','Pemutar skru'],wrench:['Wrench','Sepana'],plier:['Pliers','Playar'],tape:['Repair tape','Pita pembaikan'],bucket:['Bucket','Baldi'],washer:['New washer','Washer baru'],bulb:['New bulb','Mentol baru'],tube:['New tube light','Tiub lampu baru'],tester:['Voltage tester','Penguji voltan'],hammer:['Hammer','Tukul']};
const tn=k=>k&&k!=='none'&&TN[k]?TN[k][lang==='en'?0:1]:'-';
// per task, per step 'tool:action' (step 0 of power/water tasks is the shut-off, handled at the utility box)
const ACTS=[['','screwdriver:ccw300','washer:grab','wrench:cw360','none:ccw270'],
['bucket:grab','wrench:ccw300','none:pull','wrench:cw300','none:ccw270'],
['','none:wait3','none:ccw360','bulb:cw360','none:flipUDU'],
['','none:ccw90','none:pull','tube:cw90','none:flipUDU'],
['','none:wait3','tape:rub','wrench:cw360','none:ccw270'],
['','none:find','none:flipDU','tester:grab','none:wait3'],
['','tester:grab','plier:pull','plier:cw270','tape:rub']];
function say(x,ms=2500){const e=$('say');e.textContent=x;e.hidden=false;clearTimeout(sayT);sayT=setTimeout(()=>e.hidden=true,ms)}
function renderScore(){$('score').textContent=`${t('fixes')}: ${fixes}   ${t('score')}: ${score}`}
function renderTools(){$('tbox').innerHTML=`<h3>${t('box')}</h3><div class="tg">`+Object.keys(TN).map(k=>`<div class="tl" data-id="${k}">${tn(k)}</div>`).join('')+'</div>'}
function openTools(){toolOpen=true;renderTools();$('tbox').hidden=false}
function closeTools(){toolOpen=false;$('tbox').hidden=true}
function pickTool(k){inHand=k;closeTools()}
function curAct(){if(!picked)return null;const T=TASKS[picked.type];if(stepI>=T.en.s.length)return null;
 if(stepI===0&&T.shut!=='none')return state==='arrived'?{tool:'none',act:T.shut==='water'?'cw360':'down',shut:1}:null;
 if(state!=='scene')return null;const[a,b]=ACTS[picked.type][stepI].split(':');return{tool:a,act:b}}
function completeStep(){prog=0;flipSt=0;flipP=0;stepI++;const T=TASKS[picked.type];
 if(stepI>=T.en.s.length)finishTask();else if(stepI===1&&T.shut!=='none')say(t('shutOk'),4000);
 renderNote();renderHint()}
function finishTask(){const T=TASKS[picked.type];fixes++;score+=T.w*100;state='done';looked=false;inHand=null;led.material.color.set(0x30ff60);drip.visible=false;if(lightTask)setLight(true);renderScore()}
function actTick(dt){const A=curAct(),box=$('act');
 if(!A||phoneOpen||toolOpen){box.hidden=true;return}
 const m=A.act.match(/^(cw|ccw|grab|pull|down|wait|rub|find|flip)([A-Z\d]*)$/),k=m[1],pat=m[2];
 const need=k==='flip'?.12*pat.length:({grab:1,pull:.6,down:.22,rub:3,find:1})[k]??+pat;
 const facing=!A.shut||Math.abs(ad(yaw,Math.PI))<.7,wrong=A.tool!=='none'&&inHand!==A.tool;
 let msg=!facing?t('turnBack'):wrong?`${t('wrong')}: ${tn(A.tool)}`:t('act')[k];
 if(k==='flip'&&facing&&!wrong)msg+=' '+(pat[flipSt]==='U'?t('up'):t('dn'));
 if(facing&&!wrong){let d=0;
  if(k==='cw'||k==='ccw'){for(const h of S)if(h.st==='fist'){const v=(k==='cw'?1:-1)*h.dwr;if(v>1)d+=v*1.3}prog+=d}
  else if(k==='pull'){for(const h of S)if(h.st==='pinch')d+=h.dmv;prog+=d}
  else if(k==='rub'){for(const h of S)if(h.st==='pinch'&&h.dmv>.004)d+=h.dmv;prog+=d}
  else if(k==='down'){for(const h of S)if(h.st==='pinch')d+=Math.max(0,h.dmy);prog+=d}
  else if(k==='flip'){for(const h of S)if(h.st==='pinch')d+=pat[flipSt]==='U'?Math.max(0,-h.dmy):Math.max(0,h.dmy);flipP+=d;
   if(flipP>=.12){flipSt++;flipP=0;const up=pat[flipSt-1]==='U';if(lightTask)setLight(up);else if(picked.type===5)setSw(trip,up)}
   prog=flipSt*.12+flipP}
  else if(k==='grab'){if(S.some(h=>h.st==='pinch'))prog+=dt}
  else if(k==='find'){}
  else prog+=dt}
 if(A.shut){if(TASKS[picked.type].shut==='power'){lever.position.y=1.2-.4*Math.min(1,prog/need);if(prog/need>.5)lever.material=M(0xd03030)}else wheel.rotation.z=prog*Math.PI/180}
 box.hidden=false;box.innerHTML=`${TASKS[picked.type][lang].s[stepI]}<br>${t('tool')}: ${tn(A.tool)} | ${t('inHand')}: ${tn(inHand)}<br>${msg}<div class="bar"><i style="width:${Math.min(100,prog/need*100)}%"></i></div>`;
 if(prog>=need)completeStep()}
function testSwitch(s){const h=S[s],W=stage.clientWidth,H=stage.clientHeight,pts=[[h.cx,h.cy]];if(h.hist.length>=8)pts.push(h.hist[0]);let best=-1,bd=1e9;
 for(const p of pts)sw.forEach((m,i)=>{v3.copy(m.position).project(cam);const d=Math.hypot((v3.x*.5+.5)*W-p[0],(-v3.y*.5+.5)*H-p[1]);if(d<bd){bd=d;best=i}});
 if(bd>W*.07)return;if(best===trip){say(t('found'));completeStep()}else say(t('fine'))}
function engine(dt){actTick(dt);
 if(state==='done'&&!looked&&Math.abs(ad(yaw,.785))<.35){looked=true;say(t('thanks'),6000);renderHint()}}

/* ---------- GESTURES ---------- */
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function classify(l){
 const sc=d2(l[0],l[9])||1e-3,ext=[[8,6],[12,10],[16,14],[20,18]].map(([a,b])=>d2(l[0],l[a])>d2(l[0],l[b])*1.15);
 const th=d2(l[4],l[17])>d2(l[3],l[17])*1.1,n=ext.filter(Boolean).length;
 if(d2(l[4],l[8])/sc<.3)return'pinch';
 if(th&&ext[3]&&!ext[0]&&!ext[1]&&!ext[2])return'callme';
 if(th&&n===0&&l[4].y<l[5].y-.03)return'thumbsup';
 if(ext[0]&&!ext[1]&&!ext[2]&&!ext[3])return'point';
 if(n===4)return'open';
 if(n===0&&!th)return'fist';
 return'other'}
const S=[0,1].map(()=>({hist:[],dwr:0,dmv:0,dmy:0,g:'none',cnt:0,st:'none',vis:false,cx:0,cy:0,pa:null,wr:0,wl:null}));
function onEdge(s,g){const now=performance.now();
 if(g==='callme'&&now>cool&&['room','arrived','done'].includes(state)&&(state!=='done'||looked)){
  if(!phoneOpen){cool=now+800;callRel=0;openPhone()} else if(callRel&&now-callRel>500){cool=now+800;closePhone()}}
 if(g==='pinch'&&phoneOpen){const k=tickets.find(x=>String(x.id)===hover(s,1));if(k)travel(k)}
 if(g==='pinch'&&toolOpen){const id=hover(s,1);if(id)pickTool(id)}
 if(g==='pinch'&&state==='scene'&&!phoneOpen&&!toolOpen){const A=curAct();if(A&&A.act==='find')testSwitch(s)}
 if(g==='thumbsup'&&state==='arrived'&&!phoneOpen)snap()}
function hover(s,old){const h=S[s];if(!h.vis)return null;const r=stage.getBoundingClientRect(),pts=[[h.cx,h.cy]];if(old&&h.hist.length>=8)pts.push(h.hist[0]); // old = position just before the pinch moved the fingertip
 for(const p of pts)for(const e of document.querySelectorAll('#phone:not([hidden]) .tk,#tbox:not([hidden]) .tl')){const b=e.getBoundingClientRect(),x=p[0]+r.left,y=p[1]+r.top;if(x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom)return e.dataset.id}return null}
function handle(s,l){const h=S[s],g=classify(l);h.dwr=0;h.dmv=0;h.dmy=0;
 if(g===h.g)h.cnt++;else{h.g=g;h.cnt=1;h.pa=null}
 if(h.cnt>=3&&h.st!==g){h.st=g;h.pa=null;onEdge(s,g)}
 const W=stage.clientWidth,H=stage.clientHeight,tx=(1-l[8].x)*W,ty=l[8].y*H;
 h.cx=h.vis?h.cx+(tx-h.cx)*.5:tx;h.cy=h.vis?h.cy+(ty-h.cy)*.5:ty;h.vis=true;
 const a=Math.atan2(l[17].y-l[5].y,-(l[17].x-l[5].x));
 if(h.pa!==null&&h.st===g){let dA=a-h.pa;if(dA>Math.PI)dA-=2*Math.PI;if(dA<-Math.PI)dA+=2*Math.PI;
  if(g==='fist'){h.wr+=dA*180/Math.PI;h.dwr=dA*180/Math.PI}}
 if(g!=='fist')h.wr=0;h.pa=a;
 if(h.st==='pinch'){const mx=(l[4].x+l[8].x)/2,my=(l[4].y+l[8].y)/2;if(h.pp){h.dmv=Math.hypot(mx-h.pp[0],my-h.pp[1]);h.dmy=my-h.pp[1]}h.pp=[mx,my]}else h.pp=null;
 h.hist.push([h.cx,h.cy]);if(h.hist.length>8)h.hist.shift();
 h.turn=0;if(h.st==='point'){const dx=l[5].x-l[8].x,dy=l[8].y-l[5].y;if(Math.abs(dx)>Math.abs(dy)*1.5&&Math.abs(dx)>.06)h.turn=dx>0?-1:1} // point left/right = turn
 const c=$('c'+s);c.style.display='block';c.style.left=h.cx+'px';c.style.top=h.cy+'px';c.className='cur'+(h.st==='pinch'?' p':'')}
const ov=$('ov').getContext('2d');
function processHands(res){
 const hs=res.landmarks.map(l=>({l,x:1-l[0].x})).sort((a,b)=>a.x-b.x),seen=[0,0];
 hs.forEach((h,i)=>{const s=hs.length===2?i:(h.x<.5?0:1);seen[s]=1;handle(s,h.l)});
 [0,1].forEach(s=>{if(!seen[s]){Object.assign(S[s],{dmy:0,hist:[],dwr:0,dmv:0,pp:null,turn:0,vis:false,g:'none',cnt:0,st:'none',pa:null,wr:0});$('c'+s).style.display='none'}});
 if(phoneOpen||toolOpen)document.querySelectorAll('.tk,.tl').forEach(e=>e.classList.toggle('hv',[0,1].some(s=>hover(s)===e.dataset.id)));
 if(phoneOpen){const c=S[0].st==='callme'||S[1].st==='callme';if(c)callRel=0;else if(!callRel)callRel=performance.now()}
 ov.clearRect(0,0,640,480);ov.fillStyle='#0f0';res.landmarks.forEach(l=>l.forEach(p=>ov.fillRect(p.x*640-3,p.y*480-3,6,6)));
 const book=S[0].st==='open'&&S[1].st==='open'&&hs.length===2&&Math.abs(hs[0].l[0].x-hs[1].l[0].x)<.3;
 if(book&&!bookPrev&&state==='scene'&&!phoneOpen&&performance.now()>cool2){cool2=performance.now()+1000;toolOpen?closeTools():openTools()}
 bookPrev=book;
 $('dtxt').textContent=`L: ${S[0].st}  R: ${S[1].st}\nfist turn L/R: ${S[0].wr.toFixed(0)} / ${S[1].wr.toFixed(0)} deg\nopen book: ${book}\n(D hides this)`}

/* ---------- LOOP ---------- */
let lm=null,last=performance.now(),lastVT=-1;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(lm&&$('vid').readyState>=2&&$('vid').currentTime!==lastVT){lastVT=$('vid').currentTime;processHands(lm.detectForVideo($('vid'),now))}
 if(running()){tLeft-=dt;nextSpawn-=dt;if(nextSpawn<=0){spawn();nextSpawn=10+Math.random()*20}
  if(tLeft<=0){tLeft=0;endDay()}$('timer').textContent=`${Math.floor(tLeft/60)}:${String(Math.floor(tLeft%60)).padStart(2,'0')}`}
 if(running()&&!phoneOpen&&!toolOpen&&['room','arrived','scene','done'].includes(state))yaw+=Math.max(-1,Math.min(1,S[0].turn+S[1].turn))*1.6*dt;
 cam.rotation.y=yaw;if(running())engine(dt);if(lightTask&&(state==='scene'||state==='done')){const brk=state==='scene'&&stepI<4;fxMat.color.setHex(brk?(Math.sin(now/110)>0?0xffe9a0:0x4a4a3a):lightOn?0xfff6d0:0x3a3a30);amb.intensity=(!brk&&!lightOn)?.35:.85}else amb.intensity=.85;if(drip.visible)drip.position.y=1.1-((now/400)%1)*.3;R.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- START ---------- */
$('startBtn').onclick=async()=>{
 $('startBtn').disabled=true;$('mMsg').textContent=t('load');
 let step='camera';
 try{if(!navigator.mediaDevices)throw{name:'InsecurePage',message:'page is on '+location.protocol+' (needs https or localhost)'};
  const v=$('vid');v.srcObject=await navigator.mediaDevices.getUserMedia({video:true});await v.play();
  $('dbgPanel').style.display='block';$('mMsg').textContent='Camera OK. '+t('load');
  step='model';
  const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const mk=dl=>HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:dl},runningMode:'VIDEO',numHands:2});
  try{lm=await mk('GPU')}catch(g){console.warn('GPU failed, using CPU',g);lm=await mk('CPU')}
  $('dbgPanel').style.display='block';startDay()}
 catch(e){console.error(e);const H={NotAllowedError:'Camera is blocked. Click the camera/lock icon in the address bar, set Camera to Allow, reload. Also check Windows/Mac camera privacy settings for your browser.',NotFoundError:'No camera found.',NotReadableError:'Camera is in use by another app/tab (Zoom, Teams, etc.). Close it and retry.',InsecurePage:'Open the https:// link, not a downloaded file.'};
  $('mMsg').textContent=(step==='camera'?'CAMERA ERROR: '+(H[e.name]||''):'HAND TRACKING FAILED: ')+' ['+(e.name||'')+' '+(e.message||e)+']';$('startBtn').disabled=false}};
const fit=()=>stage.style.fontSize=stage.clientWidth/90+'px';addEventListener('resize',fit);fit();refresh();
</script></body></html>
